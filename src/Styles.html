<style>
  :root {
    --bg: #f3f7fb;
    --surface: #ffffff;
    --ink: #1b2836;
    --muted: #5a6b7d;
    --line: #dae4ee;
    --brand: #1a73c8;
    --brand-dark: #12589c;
    --brand-soft: #e5f1fc;
    --danger: #c0392b;
    --danger-soft: #fdecea;
    --warn: #a86400;
    --warn-soft: #fff4e0;
    --info: #5b4bb7;
    --info-soft: #efecfa;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(16, 32, 56, .08), 0 4px 12px rgba(16, 32, 56, .05);
    --nav-h: 64px;
    --top-h: 60px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; line-height: 1.3; }
  h2 { font-size: 1.25rem; }
  h3 { font-size: 1.05rem; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }

  /* ---------- โครงหน้า ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: var(--top-h); padding: 8px 16px;
    background: linear-gradient(135deg, var(--brand) 0%, #2b88dd 100%); color: #fff;
    box-shadow: 0 2px 8px rgba(18, 88, 156, .18);
  }
  .topbar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar .logo {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: rgba(255, 255, 255, .18);
  }
  .topbar .logo svg { width: 22px; height: 22px; }
  .topbar h1 { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
  .topbar .school { display: block; font-size: .85rem; font-weight: 400; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .date { font-size: .9rem; opacity: .9; white-space: nowrap; }
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(5, 1fr);
    height: var(--nav-h);
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border: 0; background: none; cursor: pointer; font-size: .8rem; color: var(--muted);
  }
  .nav button svg { width: 24px; height: 24px; }
  .nav button[aria-current="page"] { color: var(--brand); font-weight: 700; }
  main { max-width: 1040px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 96px); }

  @media (min-width: 900px) {
    .nav {
      position: sticky; top: var(--top-h); bottom: auto; height: auto;
      display: flex; justify-content: center; gap: 4px; padding: 6px;
      border-top: 0; border-bottom: 1px solid var(--line);
    }
    .nav button { flex-direction: row; gap: 8px; padding: 8px 18px; border-radius: 999px; font-size: 1rem; }
    .nav button svg { width: 20px; height: 20px; }
    .nav button[aria-current="page"] { background: var(--brand-soft); }
    main { padding-bottom: 120px; }
  }

  /* ---------- การ์ด / ส่วนต่าง ๆ ---------- */
  .card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--line);
    padding: 16px; margin-bottom: 16px;
  }
  .card-head h2, .report-card h3 { position: relative; padding-left: 12px; }
  .card-head h2::before, .report-card h3::before {
    content: ''; position: absolute; left: 0; top: .2em; bottom: .2em; width: 4px; border-radius: 4px; background: var(--brand);
  }
  .report-card h3 { margin-bottom: 10px; }
  .report-card .note { margin: 10px 0 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (min-width: 700px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 14px 16px; }
  .stat .num { font-size: 2rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .num .unit { font-size: 1rem; font-weight: 600; color: var(--muted); }
  .stat .label { color: var(--muted); font-size: .95rem; }
  .stat.accent .num { color: var(--brand); }
  .stat.warn .num { color: var(--warn); }
  .stat.danger .num { color: var(--danger); }

  /* ---------- ปุ่ม ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 48px; padding: 10px 18px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none;
  }
  .btn:hover { border-color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 2px 6px rgba(26, 115, 200, .25); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--brand-dark); text-decoration: underline; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.danger { color: var(--danger); border-color: #efc2bd; }
  .btn.small { min-height: 40px; padding: 6px 12px; font-size: .95rem; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  :focus-visible { outline: 3px solid #6cc4b6; outline-offset: 2px; }

  /* ---------- ฟอร์ม ---------- */
  .field { margin-bottom: 16px; }
  .field > label, .field > .label { display: block; font-weight: 600; margin-bottom: 6px; }
  .req { color: var(--danger); }
  input[type=text], input[type=tel], input[type=date], input[type=time], input[type=number], input[type=search], select, textarea {
    width: 100%; min-height: 48px; padding: 10px 12px;
    border: 1px solid #b6c6d8; border-radius: 10px; background: #fff;
  }
  textarea { min-height: 72px; resize: vertical; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 520px) { .grid-3 { grid-template-columns: 1fr 1fr; } }
  /* วันที่/เวลาแบบไทย */
  .th-input {
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
    min-height: 48px; padding: 10px 12px; border: 1px solid #b6c6d8; border-radius: 10px; background: #fff;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .th-input:focus-visible { outline: 3px solid var(--brand-soft); border-color: var(--brand); }
  .th-caret { color: var(--muted, #667); }
  .th-native { position: absolute; inset: 0; width: 100% !important; height: 100% !important; min-height: 0 !important; opacity: 0; cursor: pointer; border: 0 !important; padding: 0 !important; }
  .th-input:focus-within { outline: 3px solid var(--brand-soft); border-color: var(--brand); }
  .th-time { display: flex; align-items: center; gap: 6px; }
  .th-time select { flex: 1; min-width: 0; padding: 10px 6px; text-align: center; }
  .th-colon { font-weight: 700; }
  .error-text { color: var(--danger); font-size: .95rem; margin-top: 4px; }

  /* ชิปเลือกได้ (แตะง่าย ไม่ต้องพิมพ์) */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 44px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid #b6c6d8; background: #fff; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .chip.danger[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); }
  .check { display: flex; align-items: center; gap: 10px; min-height: 48px; cursor: pointer; }
  .check input { width: 24px; height: 24px; accent-color: var(--brand); }

  /* ค้นหานักเรียน */
  .search-wrap { position: relative; }
  .suggest {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 15;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    max-height: 340px; overflow: auto; margin: 0; padding: 4px; list-style: none;
  }
  .suggest li button {
    width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; cursor: pointer;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .suggest li button:hover, .suggest li button:focus { background: var(--brand-soft); }
  /* เลือกห้อง แล้วเลือกชื่อ */
  .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .class-chip { border-radius: 10px; font-weight: 600; font-size: 1.05rem; }
  .name-list { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 6px; }
  @media (min-width: 700px) { .name-list { grid-template-columns: 1fr 1fr; } }
  .name-btn {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 48px;
    padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; text-align: left; cursor: pointer;
  }
  .name-btn:hover, .name-btn:focus { background: var(--brand-soft); border-color: var(--brand); }
  .name-btn .tags { display: flex; gap: 4px; flex-shrink: 0; }
  .student-card {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: 12px 14px; border-radius: 10px; background: var(--brand-soft);
  }
  .student-card .name { font-weight: 700; font-size: 1.1rem; }
  .alert { border-radius: 10px; padding: 10px 14px; margin-top: 8px; }
  .alert.danger { background: var(--danger-soft); color: #8c2318; border: 1px solid #f3c1bb; }
  .alert.warn { background: var(--warn-soft); color: #7a4800; border: 1px solid #f5d9a8; }
  .alert.ok { background: var(--brand-soft); color: var(--brand-dark); border: 1px solid #b5d3f0; }
  .alert.info { background: var(--info-soft); color: #3f3290; border: 1px solid #d6cff2; }
  .alert strong { display: block; }

  /* ยา */
  .med-row { display: grid; grid-template-columns: 1fr 76px 92px 44px; gap: 8px; margin-bottom: 8px; align-items: center; }
  @media (max-width: 520px) {
    .med-row { grid-template-columns: 1fr 1fr 44px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
    .med-row > input[list] { grid-column: 1 / -1; }
  }
  .icon-btn { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; font-size: 1.2rem; }

  /* ปุ่มบันทึกติดล่าง */
  .sticky-actions {
    position: sticky; bottom: calc(var(--nav-h) + 8px); z-index: 10;
    display: flex; gap: 8px; padding: 10px; margin: 0 -4px;
    background: rgba(244, 247, 246, .95); border-radius: var(--radius); backdrop-filter: blur(4px);
  }
  @media (min-width: 900px) { .sticky-actions { bottom: 12px; } }
  .sticky-actions .btn.primary { flex: 1; font-size: 1.1rem; }

  /* ---------- รายการ ---------- */
  .list { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: 0; }
  .item.clickable { cursor: pointer; }
  .item.clickable:hover { background: #f6f9fd; }
  .item .title { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: .92rem; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    background: #e9eff6; color: var(--muted); white-space: nowrap;
  }
  .badge.ok { background: var(--brand-soft); color: var(--brand-dark); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  .badge.info { background: var(--info-soft); color: var(--info); }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (min-width: 800px) { .filters { grid-template-columns: 1fr 1fr 2fr 1fr 1fr; } }

  /* ---------- รายงาน ---------- */
  .bars { display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: minmax(110px, 32%) 1fr 44px; gap: 10px; align-items: center; }
  .bar-row.with-pct { grid-template-columns: minmax(110px, 30%) 1fr 40px 56px; }
  .bar-row .pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar-head { font-size: .85rem; color: var(--muted); font-weight: 600; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .bar-head .n { font-weight: 600; }
  .bar-head span { white-space: nowrap; }

  /* อุณหภูมิ */
  .temp-wrap { display: flex; align-items: center; gap: 10px; max-width: 240px; }
  .temp-wrap .temp-input { font-size: 1.7rem; font-weight: 700; text-align: center; min-height: 58px; }
  .temp-unit { font-size: 1.4rem; font-weight: 700; color: var(--muted); }
  .temp-ok { margin-top: 6px; color: var(--brand-dark); font-weight: 600; }

  /* ยาที่ให้ */
  .med-item { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; background: #f8fbff; }
  .med-top { display: flex; gap: 8px; align-items: center; }
  .med-top select { flex: 1; }
  .med-qty { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .step-btn { width: 48px; height: 48px; border-radius: var(--radius-sm); border: 1px solid #b6c6d8; background: #fff; font-size: 1.4rem; font-weight: 700; cursor: pointer; color: var(--brand-dark); }
  .med-qty .qty-input { width: 84px; text-align: center; font-weight: 700; font-size: 1.15rem; }
  .modal-scroll { max-height: 55vh; overflow: auto; }
  .bar-track { background: #e9eff6; border-radius: 6px; height: 14px; overflow: hidden; }
  .bar-fill { background: var(--brand); height: 100%; border-radius: 6px; }
  .bar-row .n { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  .report-grid { display: grid; gap: 16px; }
  .report-row { margin-bottom: 16px; align-items: start; }
  .report-row > .card { margin-bottom: 0; }
  @media (min-width: 800px) { .report-grid { grid-template-columns: 1fr 1fr; } }
  .print-only { display: none; }

  /* ---------- Modal / Toast / Loading ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50; background: rgba(14, 26, 44, .45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  @media (min-width: 700px) { .modal-backdrop { align-items: center; } }
  .modal {
    background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
    border-radius: 16px 16px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
  }
  @media (min-width: 700px) { .modal { border-radius: 16px; padding: 24px; } }
  .modal h2 { margin-bottom: 12px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .modal .actions .btn { flex: 1 1 auto; }
  .detail { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px); z-index: 60;
    background: #183330; color: #fff; padding: 12px 20px; border-radius: 10px; box-shadow: var(--shadow);
    max-width: calc(100% - 32px);
  }
  .toast.error { background: var(--danger); }
  .loading { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: rgba(244, 247, 246, .7); }
  .spinner { width: 44px; height: 44px; border: 4px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .boot { text-align: center; padding: 64px 16px; color: var(--muted); }

  /* ---------- PDF: วาดรายงานในกรอบ A4 นอกจอ แล้วให้ html2pdf ถ่ายภาพ ---------- */
  .pdf-holder { position: absolute; left: -12000px; top: 0; width: 718px; background: #fff; }
  .pdf-sheet { width: 718px; background: #fff; font-size: 14px; color: #111; }
  .pdf-sheet .bar-row { grid-template-columns: 130px 1fr 36px; }
  .pdf-sheet .bar-row.with-pct { grid-template-columns: 128px 1fr 30px 46px; }
  .pdf-sheet .report-row { margin-bottom: 12px; }
  .pdf-sheet .report-card h3::before, .pdf-sheet .card-head h2::before { display: none; }
  .pdf-sheet .report-card h3 { padding-left: 0; }
  .pdf-sheet table { font-size: 12.5px; }
  .pdf-sheet .print-only { display: block; }
  .pdf-sheet .no-print { display: none !important; }
  .pdf-sheet .card, .pdf-sheet .stat { box-shadow: none; border: 1px solid #cfd9e4; }
  .pdf-sheet .stats { grid-template-columns: repeat(4, 1fr); }
  .pdf-sheet .report-grid { grid-template-columns: 1fr 1fr; }
  .pdf-sheet .table-wrap { overflow: visible; }

  /* ---------- พิมพ์รายงาน ---------- */
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; font-size: 13pt; }
    .topbar, .nav, .no-print, .toast, .sticky-actions { display: none !important; }
    main { padding: 0; max-width: none; }
    .card, .stat { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    .print-only { display: block; }
    .report-grid { grid-template-columns: 1fr 1fr; }
    .bar-fill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .stats { grid-template-columns: repeat(4, 1fr); }
  }
</style>
